{% extends "base.html" %}

{% block meta %}
    <title>Edit Project - {{ name }}</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="experience-section">
        <div class="container" style="padding: 2rem; max-width: 600px; margin: 0 auto;">
            <h1>Edit Project</h1>

            <form id="edit-project-form" class="project-form">
                {% csrf_token %}

                {% for field in form %}
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>
                        <div style="width: 100%;">
                            {{ field }}
                        </div>
                        <p class="form-error" data-error-for="{{ field.name }}"></p>
                    </div>
                {% endfor %}

                <button type="submit" class="button">
                    Simpan Perubahan
                </button>
                <a href="{% url 'main:show_projects' %}"
                   class="button button-secondary">
                    Batal
                </a>
            </form>
        </div>
    </section>
</main>

<script>
    const editForm = document.getElementById('edit-project-form');
    const projectId = "{{ project.pk }}";
    const detailUrl = "{% url 'api:project-detail' project.pk %}";

    editForm.addEventListener('submit', async function(event) {
        event.preventDefault();

        const button = editForm.querySelector('button[type="submit"]');
        button.disabled = true;

        editForm.querySelectorAll('[data-error-for]').forEach(element => {
            element.textContent = '';
        });

        const formData = new FormData(editForm);
        const payload = Object.fromEntries([
            'title',
            'description',
            'tech_stack',
            'project_url',
            'project_image_url',
        ].map(name => [name, formData.get(name)]));

        try {
            const response = await fetch(detailUrl, {
                method: 'PATCH',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken'),
                },
                body: JSON.stringify(payload),
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                if (response.status === 400) {
                    Object.entries(data).forEach(([field, errors]) => {
                        const element = editForm.querySelector(
                            `[data-error-for="${field}"]`
                        );
                        if (element) {
                            element.textContent = Array.isArray(errors)
                                ? errors.join(' ')
                                : String(errors);
                        }
                    });
                    throw new Error('Periksa kembali data yang kamu masukkan.');
                }

                throw new Error(data.detail || `HTTP ${response.status}`);
            }

            window.location.href = "{% url 'main:show_projects' %}";
        } catch (error) {
            showToast('Request failed', error.message, 'error');
        } finally {
            button.disabled = false;
        }
    });
</script>
{% endblock content %}
