{% extends 'base.html' %}

{% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Information Systems &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/foto_nala.jpeg" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                    <div class="meta-row">
                        <dt>NPM</dt>
                        <dd>{{ npm }}</dd>
                    </div>
                    <div class="meta-row">
                        <dt>Program</dt>
                        <dd>{{ study_program }}</dd>
                    </div>
                    <div class="meta-row">
                        <dt>Sesi Terakhir Login</dt>
                        <dd>{{ last_login }}</dd>
                    </div>
                </dl>
                    <div class="social-links">
                        <a href="{{ github_url }}" class="social-link" target="_blank">GitHub</a>
                        <a href="{{ linkedin_url }}" class="social-link" target="_blank">LinkedIn</a>
                        <a href="mailto:{{ email }}" class="social-link">Email</a>
                    </div>
                    <div style="margin-top: 20px;">
                        <form action="{% url 'main:logout' %}" method="POST">
                            {% csrf_token %}
                            <button type="submit" class="social-link" style="background: none; border: 1px solid currentColor; cursor: pointer; padding: 8px 16px;">Logout</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
